<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ZenBox</title>

    <!-- PWA / Mobile Meta Tags -->
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0f1f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <style>
        :root {
            --bg-color: #0a0f1f;
            --text-color: #e6edf6;
            --muted-color: rgba(230, 237, 246, 0.42);
            --line-color: rgba(230, 237, 246, 0.14);
            --accent-color: #7dd3fc;
            --accent-glow: rgba(125, 211, 252, 0.35);
            --duration: 16s;             /* Total cycle time */
            --size: min(280px, 72vw);    /* Box size, drives the dot path */
            --radius: 20px;              /* Box corner radius, shared with the dot path */
            --sync-delay: 0s;            /* Negative delay used to sync visuals to audio */
            --bar-offset: calc(28px + env(safe-area-inset-bottom));
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(120% 80% at 50% -10%, #182448 0%, transparent 60%),
                radial-gradient(100% 80% at 50% 110%, #111b3a 0%, transparent 55%),
                var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .wordmark {
            position: fixed;
            top: calc(28px + env(safe-area-inset-top));
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.6em;
            text-indent: 0.6em; /* compensate trailing letter-spacing */
            color: var(--muted-color);
        }

        .stage {
            position: relative;
            width: var(--size);
            height: var(--size);
            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* Ambient glow behind the box. Static: no animation and no
           filter: blur(), so it is painted once and never touched again */
        .aura {
            position: absolute;
            inset: -35%;
            border-radius: 50%;
            background: radial-gradient(closest-side,
                var(--accent-glow) 0%,
                rgba(125, 211, 252, 0.18) 30%,
                rgba(125, 211, 252, 0.06) 55%,
                transparent 80%);
            opacity: 0.45;
            transform: scale(0.9);
            pointer-events: none;
        }

        /* BOX TRACK */
        .box-track {
            position: absolute;
            inset: 0;
            border: 1.5px solid var(--line-color);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.02);
            box-shadow: inset 0 0 40px rgba(125, 211, 252, 0.04);
        }

        /* ANIMATED DOT */
        .box-dot {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 35% 35%, #ffffff, #bae6fd);
            border-radius: 50%;
            box-shadow:
                0 0 8px var(--accent-color),
                0 0 20px var(--accent-color),
                0 0 44px var(--accent-glow);
            /* Fallback: square path via translate (corners won't hug the radius) */
            top: -7px;
            left: -7px;
            transform: translate(0, var(--size));
            will-change: transform;
            animation: moveDot var(--duration) linear infinite;
            animation-delay: var(--sync-delay);
        }

        /* Preferred: follow the rounded rect exactly. The path itself is set
           from JS (path() needs px values); it starts at the bottom-left
           corner apex so 0/25/50/75% land exactly on the corner apexes. */
        @supports (offset-path: path("M 0 0 H 10")) {
            .box-dot {
                top: 0;
                left: 0;
                transform: none;
                offset-rotate: 0deg;
                animation-name: moveDotPath;
            }
        }

        @keyframes moveDotPath {
            from { offset-distance: 0%; }
            to   { offset-distance: 100%; }
        }

        @keyframes moveDot {
            /* 0% - 25%: Inhale (Up) */
            0%   { transform: translate(0, var(--size)); }           /* Bottom-Left */
            25%  { transform: translate(0, 0); }                     /* Top-Left */
            /* 25% - 50%: Hold (Right) */
            50%  { transform: translate(var(--size), 0); }           /* Top-Right */
            /* 50% - 75%: Exhale (Down) */
            75%  { transform: translate(var(--size), var(--size)); } /* Bottom-Right */
            /* 75% - 100%: Hold (Left) */
            100% { transform: translate(0, var(--size)); }           /* Back to Bottom-Left */
        }

        /* CENTER TEXT */
        .center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 10;
        }

        .instruction {
            font-size: clamp(1.4rem, 6vw, 1.8rem);
            font-weight: 200;
            letter-spacing: 0.32em;
            text-indent: 0.32em;
            text-align: center;
            text-transform: uppercase;
        }

        /* Pseudo-element text synced to the same CSS timeline */
        .instruction::after {
            content: "Inhale";
            display: block;
            animation:
                changeText var(--duration) step-end infinite,
                textFade var(--duration) linear infinite;
            animation-delay: var(--sync-delay), var(--sync-delay);
        }

        @keyframes changeText {
            0%   { content: "Inhale"; }
            25%  { content: "Hold"; }
            50%  { content: "Exhale"; }
            75%  { content: "Hold"; }
        }

        /* Gentle crossfade at each phase boundary */
        @keyframes textFade {
            0%    { opacity: 0; }
            3%    { opacity: 1; }
            23%   { opacity: 1; }
            25%   { opacity: 0; }
            28%   { opacity: 1; }
            48%   { opacity: 1; }
            50%   { opacity: 0; }
            53%   { opacity: 1; }
            73%   { opacity: 1; }
            75%   { opacity: 0; }
            78%   { opacity: 1; }
            98%   { opacity: 1; }
            100%  { opacity: 0; }
        }

        .caption {
            font-size: 0.68rem;
            font-weight: 400;
            letter-spacing: 0.42em;
            text-indent: 0.42em;
            color: var(--muted-color);
            transition: color 0.4s ease;
        }

        /* Reset hook: dropping the animations lets us restart them in sync */
        .stage.reset .box-dot,
        .stage.reset .instruction::after {
            animation: none;
        }

        /* Finished state: everything settles at the starting apex */
        .stage.done .box-dot {
            animation: none;
        }

        .stage.done .instruction::after {
            animation: none;
            content: "Done";
        }

        .stage.done .caption {
            color: var(--accent-color);
        }

        /* CONTROLS */
        .controls {
            position: fixed;
            bottom: var(--bar-offset);
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            pointer-events: none; /* only the pills catch taps */
            z-index: 20;
        }

        .pill {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 20px;
            border-radius: 999px;
            border: 1px solid var(--line-color);
            background: rgba(20, 28, 52, 0.7);
            color: var(--muted-color);
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }

        .pill svg {
            width: 16px;
            height: 16px;
            flex: none;
        }

        .pill.on {
            color: var(--accent-color);
            border-color: rgba(125, 211, 252, 0.45);
            background: rgba(125, 211, 252, 0.08);
            box-shadow: 0 0 24px rgba(125, 211, 252, 0.15);
        }

        .pill:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 3px;
        }

        .timer-toggle .label {
            min-width: 2.2em;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.08em;
        }

        /* TIMER MENU (floats above the bar) */
        .timer-menu {
            position: fixed;
            bottom: calc(var(--bar-offset) + 54px);
            left: 50%;
            display: flex;
            gap: 4px;
            padding: 5px;
            border-radius: 999px;
            border: 1px solid var(--line-color);
            background: rgba(10, 15, 31, 0.9);
            z-index: 21;
            visibility: hidden;
            opacity: 0;
            transform: translate(-50%, 8px);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s linear 0.2s;
        }

        .timer-menu.open {
            visibility: visible;
            opacity: 1;
            transform: translate(-50%, 0);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s;
        }

        .timer-menu button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid transparent;
            background: transparent;
            color: var(--muted-color);
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .timer-menu button[aria-pressed="true"] {
            color: var(--accent-color);
            border-color: rgba(125, 211, 252, 0.45);
            background: rgba(125, 211, 252, 0.08);
        }

        .timer-menu button:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <header class="wordmark">ZENBOX</header>

    <main class="stage" id="stage">
        <div class="aura"></div>
        <div class="box-track"></div>
        <div class="box-dot"></div>

        <div class="center">
            <div class="instruction"></div>
            <div class="caption" id="caption">4 &middot; 4 &middot; 4 &middot; 4</div>
        </div>
    </main>

    <div class="timer-menu" id="timerMenu" role="group" aria-label="セッション時間">
        <button type="button" data-min="0" aria-pressed="true" aria-label="無制限">&infin;</button>
        <button type="button" data-min="2" aria-pressed="false" aria-label="2分">2m</button>
        <button type="button" data-min="3" aria-pressed="false" aria-label="3分">3m</button>
        <button type="button" data-min="5" aria-pressed="false" aria-label="5分">5m</button>
        <button type="button" data-min="10" aria-pressed="false" aria-label="10分">10m</button>
        <button type="button" data-min="15" aria-pressed="false" aria-label="15分">15m</button>
    </div>

    <div class="controls">
        <button class="pill timer-toggle" id="timerToggle" aria-haspopup="true" aria-expanded="false" aria-label="セッション時間を設定する">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="13" r="8"/>
                <path d="M12 9v4l2.6 1.6"/>
                <path d="M9.5 3h5"/>
            </svg>
            <span class="label" id="timerLabel">&infin;</span>
        </button>

        <button class="pill sound-toggle" id="soundToggle" aria-pressed="false" aria-label="サウンドを有効にする">
            <svg id="iconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 5 6.5 9H3v6h3.5L11 19V5z"/>
                <line x1="16" y1="9.5" x2="21" y2="14.5"/>
                <line x1="21" y1="9.5" x2="16" y2="14.5"/>
            </svg>
            <svg id="iconOn" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 5 6.5 9H3v6h3.5L11 19V5z"/>
                <path d="M15.5 8.8a4.6 4.6 0 0 1 0 6.4"/>
                <path d="M18.4 6a8.4 8.4 0 0 1 0 12"/>
            </svg>
            <span id="soundLabel">Sound Off</span>
        </button>
    </div>

    <script>
        // ===== PWA Service Worker =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.error('Service Worker Failed', err));
        }

        // ===== Screen Wake Lock (keeps the screen, and with it the audio
        //       context, alive while the app is in front) =====
        let wakeLock = null;

        const requestWakeLock = async () => {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        };

        requestWakeLock();

        // ===== Constants =====
        const CYCLE = 16;          // seconds, must match --duration
        const RENDER_SR = 44100;   // offline synth rate (the sound design was tuned at this rate)
        const CAPTION_DEFAULT = '4 · 4 · 4 · 4';
        const CAPTION_DONE = 'Tap to begin again';

        // ===== Session state =====
        // The timer runs on a wall clock. While audio is playing, the audio
        // context clock is the master and re-anchors startedAt on every tick.
        const session = { cycles: 0, startedAt: performance.now(), done: false }; // cycles 0 = infinite
        let soundEnabled = false;

        const sessionSeconds = () => session.cycles * CYCLE;
        const elapsed = () => (performance.now() - session.startedAt) / 1000;

        // ===== Visuals =====
        const stage = document.getElementById('stage');
        const captionEl = document.getElementById('caption');

        // Rounded-rect motion path for the dot. Starts at the bottom-left corner
        // apex; each apex-to-apex segment is (side - 2r) + (PI/2)r = exactly a
        // quarter of the total length, so constant speed keeps 4s per phase.
        const dotEl = document.querySelector('.box-dot');
        const trackEl = document.querySelector('.box-track');

        function updateDotPath() {
            if (!('offsetPath' in dotEl.style)) return; // CSS fallback handles it
            const s = stage.getBoundingClientRect().width;
            const r = parseFloat(getComputedStyle(trackEl).borderTopLeftRadius) || 0;
            const k = r * (1 - Math.SQRT1_2); // apex inset: 45° point of the arc
            const n = v => +v.toFixed(2);
            dotEl.style.offsetPath = `path("${[
                `M ${n(k)} ${n(s - k)}`,
                `A ${r} ${r} 0 0 1 0 ${n(s - r)}`,
                `L 0 ${n(r)}`,
                `A ${r} ${r} 0 0 1 ${n(r)} 0`,
                `L ${n(s - r)} 0`,
                `A ${r} ${r} 0 0 1 ${n(s)} ${n(r)}`,
                `L ${n(s)} ${n(s - r)}`,
                `A ${r} ${r} 0 0 1 ${n(s - r)} ${n(s)}`,
                `L ${n(r)} ${n(s)}`,
                `A ${r} ${r} 0 0 1 ${n(k)} ${n(s - k)}`,
                'Z'
            ].join(' ')}")`;
        }
        updateDotPath();
        window.addEventListener('resize', updateDotPath);

        // Where the CSS animations currently are in the cycle
        let visual = { offset: 0, at: performance.now() };
        const visualPhase = () => (visual.offset + (performance.now() - visual.at) / 1000) % CYCLE;

        // Restart the CSS animations, optionally offset into the cycle
        function restartVisuals(offsetSeconds = 0) {
            stage.classList.remove('done');
            stage.classList.add('reset');
            void stage.offsetWidth; // reflow to flush the removed animations
            document.documentElement.style.setProperty('--sync-delay', `-${offsetSeconds}s`);
            stage.classList.remove('reset');
            visual = { offset: offsetSeconds, at: performance.now() };
        }

        // Nudge the visuals back onto the session clock if they have drifted
        // (background throttling, audio interruptions). Small drifts are left
        // alone so the dot never visibly stutters.
        function syncVisuals(force = false) {
            if (session.done) return;
            const target = elapsed() % CYCLE;
            let drift = target - visualPhase();
            drift -= CYCLE * Math.round(drift / CYCLE);
            if (force || Math.abs(drift) > 0.1) restartVisuals(target);
        }

        // ===== Sound: Web Audio =====
        // One cycle (and one ending chime) is synthesised offline once, then
        // played through a looping AudioBufferSourceNode. The loop point is
        // sample-accurate, so there is no seam and no drift against the visuals.
        // Trade-off vs a media element: on iOS the audio pauses when the screen
        // locks and respects the silent switch; the wake lock keeps the screen
        // on while the app is in front.
        let ctx = null;
        function ensureCtx() {
            if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
            return ctx;
        }

        // Shared synth voice; renders `seconds` of stereo audio at RENDER_SR.
        // Signal path: voices -> master -> [dry + convolution reverb] -> softener.
        // `wrap`: an extra REVERB_TAIL seconds are rendered and folded back onto
        //   the start, so the loop point carries the tail instead of a cut.
        // `preroll`: that many seconds are rendered and discarded first, so
        //   filters and the reverb are in steady state at sample 0. Used for the
        //   periodic drone layer, whose loop must be continuous to the sample.
        const REVERB_TAIL = 3.0;
        async function renderBuffer(seconds, build, { wrap = false, preroll = 0 } = {}) {
            const sr = RENDER_SR;
            const total = preroll + seconds + (wrap ? REVERB_TAIL : 0);
            const off = new OfflineAudioContext(2, Math.round(sr * total), sr);

            const master = off.createGain();
            master.gain.value = 1.7;
            const softener = off.createBiquadFilter();
            softener.type = 'lowpass';
            softener.frequency.value = 5200;
            softener.connect(off.destination);

            // Dry path
            const dry = off.createGain();
            dry.gain.value = 0.8;
            master.connect(dry);
            dry.connect(softener);

            // Reverb: convolution with a synthetic stereo IR (decaying noise that
            // darkens as it fades), then a gentle high cut so the tail stays soft
            const irLen = Math.round(sr * 2.6);
            const ir = off.createBuffer(2, irLen, sr);
            for (let ch = 0; ch < 2; ch++) {
                const d = ir.getChannelData(ch);
                let lp = 0;
                for (let i = 0; i < irLen; i++) {
                    const t = i / irLen;
                    const k = 0.35 + 0.6 * t; // more low-pass towards the tail
                    lp = lp * k + (Math.random() * 2 - 1) * (1 - k);
                    d[i] = lp * Math.pow(1 - t, 2.2) * Math.exp(-3.2 * t);
                }
            }
            const verb = off.createConvolver();
            verb.buffer = ir;
            const verbTone = off.createBiquadFilter();
            verbTone.type = 'lowpass';
            verbTone.frequency.value = 3200;
            const wet = off.createGain();
            wet.gain.value = 0.55;
            master.connect(verb);
            verb.connect(verbTone);
            verbTone.connect(wet);
            wet.connect(softener);

            // Soft bell: sine fundamental + quiet upper partials, slow attack, long decay
            const tone = (t, freq, { dur = 2.4, peak = 0.13, pan = 0, attack = 0.06 } = {}) => {
                t += preroll;
                const g = off.createGain();
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(peak, t + attack);
                g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
                g.gain.linearRampToValueAtTime(0, t + dur + 0.03);
                const p = off.createStereoPanner();
                p.pan.value = pan;
                g.connect(p);
                p.connect(master);
                [[freq, 1, -3], [freq * 2, 0.24, 3], [freq * 3.01, 0.05, 0]].forEach(([f, amt, det]) => {
                    const o = off.createOscillator();
                    o.type = 'sine';
                    o.frequency.value = f;
                    o.detune.value = det;
                    const og = off.createGain();
                    og.gain.value = amt;
                    o.connect(og);
                    og.connect(g);
                    o.start(t);
                    o.stop(t + dur + 0.05);
                });
            };

            // Breath swell: band-passed noise that rises with the inhale, falls with the exhale
            const noiseBuf = off.createBuffer(1, sr * 4, sr);
            const nd = noiseBuf.getChannelData(0);
            let lp = 0;
            for (let i = 0; i < nd.length; i++) {
                lp = lp * 0.97 + (Math.random() * 2 - 1) * 0.03;
                nd[i] = lp * 8;
            }
            const swell = (t, rising) => {
                t += preroll;
                const src = off.createBufferSource();
                src.buffer = noiseBuf;
                src.loop = true;
                const f = off.createBiquadFilter();
                f.type = 'bandpass';
                f.Q.value = 0.7;
                f.frequency.setValueAtTime(rising ? 240 : 820, t);
                f.frequency.exponentialRampToValueAtTime(rising ? 820 : 240, t + 4);
                const g = off.createGain();
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(0.05, t + (rising ? 2.9 : 1.1));
                g.gain.linearRampToValueAtTime(0, t + 4.15);
                src.connect(f);
                f.connect(g);
                g.connect(master);
                src.start(t);
                src.stop(t + 4.2);
            };

            // Drone bed: a quiet E pad that never lets the mix fall to digital
            // silence. Every frequency is a multiple of 1/CYCLE Hz (within a cent
            // of pitch), so the bed is exactly periodic over one loop and the two
            // E3 partials beat once per cycle, giving slow natural movement.
            const drone = (level = 0.014) => {
                const bus = off.createGain();
                bus.gain.value = level;
                const warm = off.createBiquadFilter();
                warm.type = 'lowpass';
                warm.frequency.value = 420;
                bus.connect(warm);
                warm.connect(master);
                const step = 1 / CYCLE;
                [[1318, 1.0, -0.2], [1976, 0.55, 0.2], [2636, 0.45, -0.35], [2637, 0.45, 0.35]]
                    .forEach(([k, amt, pan]) => {   // E2, B2, E3, E3(+6.6 cents)
                        const o = off.createOscillator();
                        o.type = 'sine';
                        o.frequency.value = k * step;
                        const g = off.createGain();
                        g.gain.value = amt;
                        const p = off.createStereoPanner();
                        p.pan.value = pan;
                        o.connect(g);
                        g.connect(p);
                        p.connect(bus);
                        o.start(0);
                    });
            };

            build({ tone, swell, drone });
            const full = await off.startRendering();
            if (!wrap && !preroll) return full;

            // Drop the preroll; fold the tail back onto the head so the loop is seamless
            const skip = Math.round(sr * preroll);
            const len = Math.round(sr * seconds);
            const out = off.createBuffer(2, len, sr);
            for (let ch = 0; ch < 2; ch++) {
                const src = full.getChannelData(ch);
                const dst = out.getChannelData(ch);
                dst.set(src.subarray(skip, skip + len));
                for (let i = skip + len; i < src.length; i++) dst[i - skip - len] += src[i];
            }
            return out;
        }

        // Sum equal-length buffers into the first one
        function mixInto(base, ...layers) {
            for (const layer of layers) {
                for (let ch = 0; ch < base.numberOfChannels; ch++) {
                    const d = base.getChannelData(ch);
                    const l = layer.getChannelData(ch);
                    for (let i = 0; i < d.length; i++) d[i] += l[i];
                }
            }
            return base;
        }

        // Cues on an E-pentatonic palette over a quiet drone:
        // inhale = rising pair, inhale-hold = G#4, exhale = falling pair,
        // exhale-hold = B3 (lower, so the two holds are distinguishable by ear).
        // The cues are rendered with a folded reverb tail; the drone is rendered
        // separately after a preroll (steady-state filters, exactly periodic),
        // so neither layer has a discontinuity at the loop point.
        const renderCycle = async () => mixInto(...await Promise.all([
            renderBuffer(CYCLE, ({ tone, swell }) => {
            tone(0.00,  329.63, { peak: 0.13, pan: -0.15, attack: 0.18 }); // E4
            tone(0.35,  493.88, { peak: 0.10, pan:  0.15, attack: 0.25 }); // B4  (rising)
            tone(4.00,  415.30, { peak: 0.10, dur: 2.2, attack: 0.15 });   // G#4 (inhale hold)
            tone(8.00,  493.88, { peak: 0.13, pan:  0.15, attack: 0.18 }); // B4
            tone(8.35,  329.63, { peak: 0.10, pan: -0.15, attack: 0.25 }); // E4  (falling)
            tone(12.00, 246.94, { peak: 0.11, dur: 2.2, attack: 0.15 });   // B3  (exhale hold)
            swell(0, true);
            swell(8, false);
            }, { wrap: true }),
            renderBuffer(CYCLE, ({ drone }) => drone(), { preroll: 4 }),
        ]));

        // Ending chime: a slow descending E-major arpeggio that settles on E4
        const renderChime = () => renderBuffer(7, ({ tone }) => {
            tone(0.0, 659.25, { peak: 0.10, pan: -0.10, dur: 3.5, attack: 0.12 });  // E5
            tone(0.5, 493.88, { peak: 0.10, pan:  0.10, dur: 4.0, attack: 0.12 });  // B4
            tone(1.0, 329.63, { peak: 0.12, dur: 5.5, attack: 0.15 });              // E4
        });

        let cycleBufPromise = null;
        let chimeBufPromise = null;
        const getCycleBuf = () => cycleBufPromise || (cycleBufPromise = renderCycle());
        const getChimeBuf = () => chimeBufPromise || (chimeBufPromise = renderChime());
        // Pre-render in the background so the first toggle responds instantly
        setTimeout(() => { getCycleBuf(); getChimeBuf(); }, 500);

        // Currently sounding graph. t0 is the context time of session second 0,
        // so `ctx.currentTime - t0` is the audio clock's view of elapsed().
        let playing = null; // { master, loopSrc, chimeSrc, t0 }
        const audioElapsed = () => (playing ? ctx.currentTime - playing.t0 : null);

        // Start (or re-seek) playback at a given point of the session
        async function startAudio(atSeconds) {
            const ac = ensureCtx();
            if (ac.state !== 'running') await ac.resume();
            const [cycle, chime] = await Promise.all([getCycleBuf(), getChimeBuf()]);
            stopAudio(0.12);

            const now = ac.currentTime + 0.03;
            const t0 = now - atSeconds;
            // The loop is never silent (drone bed), so every start is a fade-in
            const master = ac.createGain();
            master.gain.setValueAtTime(0, now);
            master.gain.linearRampToValueAtTime(1, now + 0.25);
            master.connect(ac.destination);

            const loopGain = ac.createGain();
            loopGain.connect(master);
            const loopSrc = ac.createBufferSource();
            loopSrc.buffer = cycle;
            loopSrc.loop = true;
            loopSrc.connect(loopGain);
            loopSrc.start(now, atSeconds % CYCLE);

            let chimeSrc = null;
            if (session.cycles) {
                // Timed session: the chime starts exactly on the last cycle
                // boundary while the loop (drone included) fades out under it
                const tEnd = Math.max(now, t0 + sessionSeconds());
                const LOOP_FADE = 2.5;
                loopGain.gain.setValueAtTime(1, tEnd);
                loopGain.gain.linearRampToValueAtTime(0, tEnd + LOOP_FADE);
                loopSrc.stop(tEnd + LOOP_FADE + 0.05);
                chimeSrc = ac.createBufferSource();
                chimeSrc.buffer = chime;
                chimeSrc.connect(master);
                chimeSrc.start(tEnd);
            }

            playing = { master, loopSrc, chimeSrc, t0 };
        }

        // Fade out and release whatever is sounding
        function stopAudio(fade = 0.15) {
            if (!playing) return;
            const { master, loopSrc, chimeSrc } = playing;
            playing = null;
            const now = ctx.currentTime;
            master.gain.cancelScheduledValues(now);
            master.gain.setValueAtTime(master.gain.value, now);
            master.gain.linearRampToValueAtTime(0, now + fade);
            for (const src of [loopSrc, chimeSrc]) {
                if (!src) continue;
                try { src.stop(now + fade + 0.02); } catch (_) { /* already stopped */ }
            }
            setTimeout(() => master.disconnect(), (fade + 0.1) * 1000);
        }

        // ===== Sound toggle (default: OFF) =====
        const toggleBtn = document.getElementById('soundToggle');
        const iconOn = document.getElementById('iconOn');
        const iconOff = document.getElementById('iconOff');
        const soundLabel = document.getElementById('soundLabel');

        function updateToggleUI() {
            const on = soundEnabled;
            toggleBtn.classList.toggle('on', on);
            toggleBtn.setAttribute('aria-pressed', String(on));
            toggleBtn.setAttribute('aria-label', on ? 'サウンドを無効にする' : 'サウンドを有効にする');
            iconOn.classList.toggle('hidden', !on);
            iconOff.classList.toggle('hidden', on);
            soundLabel.textContent = on ? 'Sound On' : 'Sound Off';
        }

        // Joins the running session in sync rather than restarting it
        async function enableSound() {
            soundEnabled = true;
            updateToggleUI();
            if (!session.done) await startAudio(elapsed());
        }

        function disableSound() {
            soundEnabled = false;
            stopAudio();
            updateToggleUI();
        }

        toggleBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            closeMenu();
            try {
                if (soundEnabled) {
                    disableSound();
                } else {
                    await enableSound();
                }
            } catch (err) {
                console.error('Sound toggle failed', err);
                disableSound();
            }
        });

        // ===== Timer =====
        const timerToggle = document.getElementById('timerToggle');
        const timerLabel = document.getElementById('timerLabel');
        const timerMenu = document.getElementById('timerMenu');
        const timerOptions = Array.from(timerMenu.querySelectorAll('button'));

        function formatRemaining() {
            const remain = Math.max(0, Math.ceil(sessionSeconds() - elapsed()));
            const m = Math.floor(remain / 60);
            const s = String(remain % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimerLabel() {
            timerLabel.textContent = session.cycles ? formatRemaining() : '∞';
        }

        function openMenu() {
            timerMenu.classList.add('open');
            timerToggle.setAttribute('aria-expanded', 'true');
        }

        function closeMenu() {
            timerMenu.classList.remove('open');
            timerToggle.setAttribute('aria-expanded', 'false');
        }

        const menuOpen = () => timerMenu.classList.contains('open');

        timerToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            menuOpen() ? closeMenu() : openMenu();
        });

        timerMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            const btn = e.target.closest('button[data-min]');
            if (!btn) return;
            const minutes = Number(btn.dataset.min);
            // Whole cycles only, rounded up, so a session always ends on the
            // exhale-hold at the starting apex
            session.cycles = minutes ? Math.ceil(minutes * 60 / CYCLE) : 0;
            timerOptions.forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
            closeMenu();
            startSession().catch(err => console.error('Session start failed', err));
        });

        // ===== Session control =====
        async function startSession() {
            session.startedAt = performance.now();
            session.done = false;
            captionEl.textContent = CAPTION_DEFAULT;
            restartVisuals(0);
            updateTimerLabel();
            if (soundEnabled) {
                await startAudio(0);
            } else {
                stopAudio();
            }
        }

        function finishSession() {
            if (session.done) return;
            session.done = true;
            stage.classList.add('done');
            captionEl.textContent = CAPTION_DONE;
            updateTimerLabel();
            // The chime is already scheduled on the audio clock; nothing to do here
        }

        function tick() {
            if (!session.done && playing && ctx.state === 'running') {
                // Audio clock is the master while it runs
                session.startedAt = performance.now() - audioElapsed() * 1000;
                syncVisuals();
            }
            if (!session.done && session.cycles && elapsed() >= sessionSeconds()) finishSession();
            updateTimerLabel();
        }
        setInterval(tick, 250);

        // ===== Lifecycle =====
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState !== 'visible') return;
            if (wakeLock !== null) await requestWakeLock();
            tick();
            if (!session.done && soundEnabled) {
                // The context may have been suspended or interrupted while hidden;
                // rejoin at the wall-clock position (may be refused without a gesture)
                const stale = !playing || ctx.state !== 'running' || Math.abs(audioElapsed() - elapsed()) > 0.5;
                if (stale) startAudio(elapsed()).catch(() => {});
            }
            // CSS animations throttle in the background; snap them back to the clock
            syncVisuals(true);
        });

        // Tap anywhere: restart the session (audio, visuals and timer together)
        document.body.addEventListener('click', () => {
            requestWakeLock();
            if (menuOpen()) { closeMenu(); return; }
            startSession().catch(err => console.error('Session start failed', err));
        });
    </script>
</body>
</html>
