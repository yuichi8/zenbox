<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ZenBox</title>

    <!-- PWA / Mobile Meta Tags -->
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0f1f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.svg" type="image/svg+xml">

    <style>
        :root {
            --bg-color: #0a0f1f;
            --text-color: #e6edf6;
            --muted-color: rgba(230, 237, 246, 0.42);
            --line-color: rgba(230, 237, 246, 0.14);
            --accent-color: #7dd3fc;
            --accent-glow: rgba(125, 211, 252, 0.35);
            --duration: 16s;             /* Total cycle time */
            --size: min(280px, 72vw);    /* Box size, drives the dot path */
            --radius: 20px;              /* Box corner radius, shared with the dot path */
            --sync-delay: 0s;            /* Negative delay used to sync visuals to audio */
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(120% 80% at 50% -10%, #182448 0%, transparent 60%),
                radial-gradient(100% 80% at 50% 110%, #111b3a 0%, transparent 55%),
                var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .wordmark {
            position: fixed;
            top: calc(28px + env(safe-area-inset-top));
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.6em;
            text-indent: 0.6em; /* compensate trailing letter-spacing */
            color: var(--muted-color);
        }

        .stage {
            position: relative;
            width: var(--size);
            height: var(--size);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ambient glow that breathes with the cycle */
        .aura {
            position: absolute;
            inset: -35%;
            border-radius: 50%;
            background: radial-gradient(closest-side, var(--accent-glow), transparent 70%);
            filter: blur(42px);
            opacity: 0.35;
            transform: scale(0.75);
            animation: breatheAura var(--duration) ease-in-out infinite;
            animation-delay: var(--sync-delay);
            pointer-events: none;
        }

        @keyframes breatheAura {
            0%   { transform: scale(0.75); opacity: 0.3; }  /* start inhale */
            25%  { transform: scale(1.08); opacity: 0.75; } /* full */
            50%  { transform: scale(1.08); opacity: 0.75; } /* hold */
            75%  { transform: scale(0.75); opacity: 0.3; }  /* empty */
            100% { transform: scale(0.75); opacity: 0.3; }  /* hold */
        }

        /* BOX TRACK */
        .box-track {
            position: absolute;
            inset: 0;
            border: 1.5px solid var(--line-color);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.02);
            box-shadow: inset 0 0 40px rgba(125, 211, 252, 0.04);
        }

        /* ANIMATED DOT */
        .box-dot {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 35% 35%, #ffffff, #bae6fd);
            border-radius: 50%;
            box-shadow:
                0 0 8px var(--accent-color),
                0 0 20px var(--accent-color),
                0 0 44px var(--accent-glow);
            /* Fallback: square path via translate (corners won't hug the radius) */
            top: -7px;
            left: -7px;
            will-change: transform;
            animation: moveDot var(--duration) linear infinite;
            animation-delay: var(--sync-delay);
        }

        /* Preferred: follow the rounded rect exactly. The path itself is set
           from JS (path() needs px values); it starts at the bottom-left
           corner apex so 0/25/50/75% land exactly on the corner apexes. */
        @supports (offset-path: path("M 0 0 H 10")) {
            .box-dot {
                top: 0;
                left: 0;
                offset-rotate: 0deg;
                animation-name: moveDotPath;
            }
        }

        @keyframes moveDotPath {
            from { offset-distance: 0%; }
            to   { offset-distance: 100%; }
        }

        @keyframes moveDot {
            /* 0% - 25%: Inhale (Up) */
            0%   { transform: translate(0, var(--size)); }           /* Bottom-Left */
            25%  { transform: translate(0, 0); }                     /* Top-Left */
            /* 25% - 50%: Hold (Right) */
            50%  { transform: translate(var(--size), 0); }           /* Top-Right */
            /* 50% - 75%: Exhale (Down) */
            75%  { transform: translate(var(--size), var(--size)); } /* Bottom-Right */
            /* 75% - 100%: Hold (Left) */
            100% { transform: translate(0, var(--size)); }           /* Back to Bottom-Left */
        }

        /* CENTER TEXT */
        .center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 10;
        }

        .instruction {
            font-size: clamp(1.4rem, 6vw, 1.8rem);
            font-weight: 200;
            letter-spacing: 0.32em;
            text-indent: 0.32em;
            text-align: center;
            text-transform: uppercase;
        }

        /* Pseudo-element text synced to the same CSS timeline */
        .instruction::after {
            content: "Inhale";
            display: block;
            animation:
                changeText var(--duration) step-end infinite,
                textFade var(--duration) linear infinite;
            animation-delay: var(--sync-delay), var(--sync-delay);
        }

        @keyframes changeText {
            0%   { content: "Inhale"; }
            25%  { content: "Hold"; }
            50%  { content: "Exhale"; }
            75%  { content: "Hold"; }
        }

        /* Gentle crossfade at each phase boundary */
        @keyframes textFade {
            0%    { opacity: 0; }
            3%    { opacity: 1; }
            23%   { opacity: 1; }
            25%   { opacity: 0; }
            28%   { opacity: 1; }
            48%   { opacity: 1; }
            50%   { opacity: 0; }
            53%   { opacity: 1; }
            73%   { opacity: 1; }
            75%   { opacity: 0; }
            78%   { opacity: 1; }
            98%   { opacity: 1; }
            100%  { opacity: 0; }
        }

        .caption {
            font-size: 0.68rem;
            font-weight: 400;
            letter-spacing: 0.42em;
            text-indent: 0.42em;
            color: var(--muted-color);
        }

        /* Reset hook: dropping the animations lets us restart them in sync */
        .stage.reset .aura,
        .stage.reset .box-dot,
        .stage.reset .instruction::after {
            animation: none;
        }

        /* SOUND TOGGLE */
        .sound-toggle {
            position: fixed;
            bottom: calc(28px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 20px;
            border-radius: 999px;
            border: 1px solid var(--line-color);
            background: rgba(255, 255, 255, 0.05);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            color: var(--muted-color);
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }

        .sound-toggle svg {
            width: 16px;
            height: 16px;
            flex: none;
        }

        .sound-toggle.on {
            color: var(--accent-color);
            border-color: rgba(125, 211, 252, 0.45);
            background: rgba(125, 211, 252, 0.08);
            box-shadow: 0 0 24px rgba(125, 211, 252, 0.15);
        }

        .sound-toggle:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 3px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <header class="wordmark">ZENBOX</header>

    <main class="stage" id="stage">
        <div class="aura"></div>
        <div class="box-track"></div>
        <div class="box-dot"></div>

        <div class="center">
            <div class="instruction"></div>
            <div class="caption">4 &middot; 4 &middot; 4 &middot; 4</div>
        </div>
    </main>

    <button class="sound-toggle" id="soundToggle" aria-pressed="false" aria-label="サウンドを有効にする">
        <svg id="iconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6.5 9H3v6h3.5L11 19V5z"/>
            <line x1="16" y1="9.5" x2="21" y2="14.5"/>
            <line x1="21" y1="9.5" x2="16" y2="14.5"/>
        </svg>
        <svg id="iconOn" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6.5 9H3v6h3.5L11 19V5z"/>
            <path d="M15.5 8.8a4.6 4.6 0 0 1 0 6.4"/>
            <path d="M18.4 6a8.4 8.4 0 0 1 0 12"/>
        </svg>
        <span id="soundLabel">Sound Off</span>
    </button>

    <script>
        // ===== PWA Service Worker =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.error('Service Worker Failed', err));
        }

        // ===== Screen Wake Lock (keeps the screen on while watching; audio keeps
        //       guiding even if the user locks the screen manually) =====
        let wakeLock = null;

        const requestWakeLock = async () => {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        };

        requestWakeLock();

        // ===== Visual sync =====
        const CYCLE = 16; // seconds, must match --duration
        const stage = document.getElementById('stage');

        // Rounded-rect motion path for the dot. Starts at the bottom-left corner
        // apex; each apex-to-apex segment is (side - 2r) + (PI/2)r = exactly a
        // quarter of the total length, so constant speed keeps 4s per phase.
        const dotEl = document.querySelector('.box-dot');
        const trackEl = document.querySelector('.box-track');

        function updateDotPath() {
            if (!('offsetPath' in dotEl.style)) return; // CSS fallback handles it
            const s = stage.getBoundingClientRect().width;
            const r = parseFloat(getComputedStyle(trackEl).borderTopLeftRadius) || 0;
            const k = r * (1 - Math.SQRT1_2); // apex inset: 45° point of the arc
            const n = v => +v.toFixed(2);
            dotEl.style.offsetPath = `path("${[
                `M ${n(k)} ${n(s - k)}`,
                `A ${r} ${r} 0 0 1 0 ${n(s - r)}`,
                `L 0 ${n(r)}`,
                `A ${r} ${r} 0 0 1 ${n(r)} 0`,
                `L ${n(s - r)} 0`,
                `A ${r} ${r} 0 0 1 ${n(s)} ${n(r)}`,
                `L ${n(s)} ${n(s - r)}`,
                `A ${r} ${r} 0 0 1 ${n(s - r)} ${n(s)}`,
                `L ${n(r)} ${n(s)}`,
                `A ${r} ${r} 0 0 1 ${n(k)} ${n(s - k)}`,
                'Z'
            ].join(' ')}")`;
        }
        updateDotPath();
        window.addEventListener('resize', updateDotPath);

        // Restart the CSS animations, optionally offset into the cycle
        function restartVisuals(offsetSeconds = 0) {
            stage.classList.add('reset');
            void stage.offsetWidth; // reflow to flush the removed animations
            document.documentElement.style.setProperty('--sync-delay', `-${offsetSeconds}s`);
            stage.classList.remove('reset');
        }

        // ===== Sound: one 16s cycle pre-rendered to WAV, looped via <audio>.
        //       Media-element playback keeps running under a locked screen
        //       (and ignores the iOS silent switch), unlike live Web Audio. =====
        const audioEl = document.createElement('audio');
        audioEl.loop = true;
        audioEl.setAttribute('playsinline', '');
        document.body.appendChild(audioEl);

        function encodeWav(buffer) {
            const numCh = buffer.numberOfChannels;
            const sr = buffer.sampleRate;
            const len = buffer.length;
            const bytes = 44 + len * numCh * 2;
            const ab = new ArrayBuffer(bytes);
            const v = new DataView(ab);
            const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
            writeStr(0, 'RIFF'); v.setUint32(4, bytes - 8, true); writeStr(8, 'WAVE');
            writeStr(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
            v.setUint16(22, numCh, true); v.setUint32(24, sr, true);
            v.setUint32(28, sr * numCh * 2, true); v.setUint16(32, numCh * 2, true);
            v.setUint16(34, 16, true); writeStr(36, 'data'); v.setUint32(40, len * numCh * 2, true);
            const chs = [];
            for (let c = 0; c < numCh; c++) chs.push(buffer.getChannelData(c));
            let o = 44;
            for (let i = 0; i < len; i++) {
                for (let c = 0; c < numCh; c++) {
                    const s = Math.max(-1, Math.min(1, chs[c][i]));
                    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
                    o += 2;
                }
            }
            return ab;
        }

        async function renderLoopWav() {
            const sr = 44100;
            const ctx = new OfflineAudioContext(2, sr * CYCLE, sr);

            const master = ctx.createGain();
            master.gain.value = 1;
            const softener = ctx.createBiquadFilter();
            softener.type = 'lowpass';
            softener.frequency.value = 5200;
            master.connect(softener);
            softener.connect(ctx.destination);

            // Soft bell: sine fundamental + quiet upper partials, slow attack, long decay
            const tone = (t, freq, { dur = 2.4, peak = 0.13, pan = 0, attack = 0.06 } = {}) => {
                const g = ctx.createGain();
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(peak, t + attack);
                g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
                g.gain.linearRampToValueAtTime(0, t + dur + 0.03);
                const p = ctx.createStereoPanner();
                p.pan.value = pan;
                g.connect(p);
                p.connect(master);
                [[freq, 1, -3], [freq * 2, 0.24, 3], [freq * 3.01, 0.05, 0]].forEach(([f, amt, det]) => {
                    const o = ctx.createOscillator();
                    o.type = 'sine';
                    o.frequency.value = f;
                    o.detune.value = det;
                    const og = ctx.createGain();
                    og.gain.value = amt;
                    o.connect(og);
                    og.connect(g);
                    o.start(t);
                    o.stop(t + dur + 0.05);
                });
            };

            // Breath swell: band-passed noise that rises with the inhale, falls with the exhale
            const noiseBuf = ctx.createBuffer(1, sr * 4, sr);
            const nd = noiseBuf.getChannelData(0);
            let lp = 0;
            for (let i = 0; i < nd.length; i++) {
                lp = lp * 0.97 + (Math.random() * 2 - 1) * 0.03;
                nd[i] = lp * 8;
            }
            const swell = (t, rising) => {
                const src = ctx.createBufferSource();
                src.buffer = noiseBuf;
                src.loop = true;
                const f = ctx.createBiquadFilter();
                f.type = 'bandpass';
                f.Q.value = 0.7;
                f.frequency.setValueAtTime(rising ? 240 : 820, t);
                f.frequency.exponentialRampToValueAtTime(rising ? 820 : 240, t + 4);
                const g = ctx.createGain();
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(0.05, t + (rising ? 2.9 : 1.1));
                g.gain.linearRampToValueAtTime(0, t + 4.15);
                src.connect(f);
                f.connect(g);
                g.connect(master);
                src.start(t);
                src.stop(t + 4.2);
            };

            // Cues on an E-pentatonic palette:
            // inhale = rising pair, exhale = falling pair, both holds = same single tone
            tone(0.00,  329.63, { peak: 0.13, pan: -0.15 }); // E4
            tone(0.22,  493.88, { peak: 0.11, pan:  0.15 }); // B4  (rising)
            tone(4.00,  415.30, { peak: 0.10, dur: 2.0 });   // G#4 (hold)
            tone(8.00,  493.88, { peak: 0.13, pan:  0.15 }); // B4
            tone(8.22,  329.63, { peak: 0.11, pan: -0.15 }); // E4  (falling)
            tone(12.00, 415.30, { peak: 0.10, dur: 2.0 });   // G#4 (hold)
            swell(0, true);
            swell(8, false);

            const rendered = await ctx.startRendering();
            return new Blob([encodeWav(rendered)], { type: 'audio/wav' });
        }

        let loopUrlPromise = null;
        function getLoopUrl() {
            if (!loopUrlPromise) {
                loopUrlPromise = renderLoopWav().then(blob => URL.createObjectURL(blob));
            }
            return loopUrlPromise;
        }
        // Pre-render in the background so the first toggle responds instantly
        setTimeout(getLoopUrl, 500);

        // ===== Sound toggle (default: OFF) =====
        const toggleBtn = document.getElementById('soundToggle');
        const iconOn = document.getElementById('iconOn');
        const iconOff = document.getElementById('iconOff');
        const soundLabel = document.getElementById('soundLabel');

        function updateToggleUI() {
            const on = !audioEl.paused;
            toggleBtn.classList.toggle('on', on);
            toggleBtn.setAttribute('aria-pressed', String(on));
            toggleBtn.setAttribute('aria-label', on ? 'サウンドを無効にする' : 'サウンドを有効にする');
            iconOn.classList.toggle('hidden', !on);
            iconOff.classList.toggle('hidden', on);
            soundLabel.textContent = on ? 'Sound On' : 'Sound Off';
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = on ? 'playing' : 'paused';
            }
        }

        async function enableSound() {
            if (!audioEl.src) audioEl.src = await getLoopUrl();
            audioEl.currentTime = 0;
            await audioEl.play();
            restartVisuals(0);
        }

        function disableSound() {
            audioEl.pause();
        }

        toggleBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            try {
                if (audioEl.paused) {
                    await enableSound();
                } else {
                    disableSound();
                }
            } catch (err) {
                console.error('Sound toggle failed', err);
            }
        });

        audioEl.addEventListener('play', updateToggleUI);
        audioEl.addEventListener('pause', updateToggleUI);

        // Lock-screen media controls
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'Box Breathing 4-4-4-4',
                artist: 'ZenBox',
                artwork: [{ src: 'icon.svg', sizes: 'any', type: 'image/svg+xml' }]
            });
            navigator.mediaSession.setActionHandler('play', () => { enableSound().catch(() => {}); });
            navigator.mediaSession.setActionHandler('pause', disableSound);
        }

        // ===== Lifecycle =====
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState !== 'visible') return;
            if (wakeLock !== null) await requestWakeLock();
            // CSS animations throttle in the background; snap them back to the audio clock
            if (!audioEl.paused) restartVisuals(audioEl.currentTime % CYCLE);
        });

        // Tap anywhere: restart the cycle (audio and visuals together)
        document.body.addEventListener('click', () => {
            requestWakeLock();
            if (!audioEl.paused) audioEl.currentTime = 0;
            restartVisuals(0);
        });
    </script>
</body>
</html>
